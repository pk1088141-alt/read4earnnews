<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsBuddy - Read Real News & Earn</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PASTE YOUR MONETAG POPUNDER CODE HERE -->
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

  <!-- Navigation Bar -->
  <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center max-w-4xl mx-auto rounded-b-2xl shadow-lg">
    <div class="flex items-center gap-2">
      <span class="text-2xl">⚡</span>
      <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">NewsBuddy</h1>
    </div>
    <div class="bg-indigo-950 border border-indigo-500/30 px-4 py-1.5 rounded-full">
      <span class="text-amber-400 font-bold">🪙 <span id="user-coins">0.0</span> Coins</span>
    </div>
  </nav>

  <!-- Content Grid -->
  <main class="max-w-4xl mx-auto px-4 mt-6 grid md:grid-cols-3 gap-6">

    <!-- Articles List Column -->
    <section class="md:col-span-2 space-y-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-semibold text-slate-300">🔥 Live News</h2>
        <select id="news-category" onchange="fetchLiveNews()" class="bg-slate-800 text-xs border border-slate-700 rounded-lg p-1.5 text-slate-300">
          <option value="technology">Technology</option>
          <option value="science">Science</option>
          <option value="entertainment">Entertainment</option>
          <option value="sports">Sports</option>
        </select>
      </div>

      <div id="news-container" class="space-y-4">
        <p class="text-slate-400 text-sm">Loading articles...</p>
      </div>

      <!-- Monetag Smartlink Direct Offer Banner -->
      <div class="bg-gradient-to-r from-pink-900/30 to-purple-900/30 border border-pink-500/30 p-4 rounded-xl text-center">
        <p class="text-sm font-medium text-pink-200 mb-2">🎁 Want Bonus Coins? Check Sponsor Offers!</p>
        <a href="YOUR_MONETAG_SMARTLINK_URL" target="_blank" class="inline-block bg-pink-600 hover:bg-pink-500 text-white text-xs font-bold px-4 py-2 rounded-lg shadow transition">
          View Sponsor Offer (+2 Coins)
        </a>
      </div>
    </section>

    <!-- Cash Out Side Panel -->
    <aside class="bg-slate-800 border border-slate-700 p-5 rounded-xl h-fit sticky top-24">
      <h2 class="text-md font-bold text-slate-200 border-b border-slate-700 pb-2 mb-4">💸 Redeem Earnings</h2>
      
      <form id="withdraw-form" onsubmit="handleWithdraw(event)" class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Method</label>
          <select id="pay-method" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 text-white">
            <option value="UPI">UPI</option>
            <option value="Paytm">Paytm</option>
            <option value="PayPal">PayPal</option>
            <option value="Crypto">USDT</option>
          </select>
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">Payout Account Info</label>
          <input type="text" id="pay-details" required placeholder="UPI ID / Email" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 text-white">
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">Amount (Min 50 Coins)</label>
          <input type="number" id="pay-amount" min="50" required placeholder="50" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 text-white">
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-sm transition">
          Request Payout
        </button>
      </form>
      <p class="text-[11px] text-slate-500 mt-3 text-center">🛡️ Minimum payout: 50 Coins</p>
    </aside>

  </main>

  <script src="app.js"></script>
</body>
</html>
