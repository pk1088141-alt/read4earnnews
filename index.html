<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsBuddy - Read Live News & Earn Coins Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="title" content="NewsBuddy - Read Live News & Earn Coins Online">
  <meta name="description" content="Read real-time tech, science, and sports news on NewsBuddy. Earn reward coins while staying updated and redeem instantly via UPI, Paytm, or PayPal.">
  <meta name="keywords" content="read news and earn, earn coins online, newsbuddy, student rewards app, read and earn UPI cash, latest news rewards, earn money reading articles">
  <meta name="monetag" content="f5d04860924389d9dccf9537fd828d7b">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

  <!-- Header -->
  <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center max-w-4xl mx-auto rounded-b-2xl shadow-lg">
    <div class="flex items-center gap-2">
      <span class="text-2xl">⚡</span>
      <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">NewsBuddy</h1>
    </div>
    <div class="bg-indigo-950 border border-indigo-500/30 px-4 py-1.5 rounded-full">
      <span class="text-amber-400 font-bold">🪙 <span id="user-coins">0.0</span> Coins</span>
    </div>
  </nav>

  <!-- Main Grid -->
  <main class="max-w-4xl mx-auto px-4 mt-6 grid md:grid-cols-3 gap-6">

    <!-- News Feed Column -->
    <section class="md:col-span-2 space-y-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-semibold text-slate-300">🔥 Live Student News</h2>
        <select id="news-category" onchange="fetchLiveNews()" class="bg-slate-800 text-xs border border-slate-700 rounded-lg p-1.5 text-slate-300">
          <option value="technology">Technology</option>
          <option value="science">Science</option>
          <option value="entertainment">Entertainment</option>
          <option value="sports">Sports</option>
        </select>
      </div>

      <!-- Container where live news is injected -->
      <div id="news-container" class="space-y-4">
        <p class="text-slate-400 text-sm">Loading latest news...</p>
      </div>
    </section>

    <!-- Sidebar Column -->
    <aside class="space-y-4 sticky top-24 h-fit">
      
      <!-- Withdrawal Panel -->
      <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl">
        <h2 class="text-md font-bold text-slate-200 border-b border-slate-700 pb-2 mb-4">💸 Redeem Earnings</h2>
        
        <form id="withdraw-form" onsubmit="handleWithdraw(event)" class="space-y-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Withdraw Method</label>
            <select id="pay-method" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 text-white">
              <option value="UPI">UPI</option>
              <option value="Paytm">Paytm</option>
              <option value="PayPal">PayPal</option>
              <option value="USDT">USDT</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-slate-400 block mb-1">Account Details (UPI ID / Email)</label>
            <input type="text" id="pay-details" required placeholder="e.g. user@upi" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 text-white">
          </div>

          <div>
            <label class="text-xs text-slate-400 block mb-1">Amount (Min. 50 Coins)</label>
            <input type="number" id="pay-amount" min="50" required placeholder="50" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 text-white">
          </div>

          <button type="submit" id="withdraw-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-sm transition">
            Request Payout
          </button>
        </form>
        <p class="text-[11px] text-slate-500 mt-3 text-center">🛡️ Anti-Fraud Protected. Min. 50 Coins.</p>
      </div>

      <!-- Telegram Contact Support Panel -->
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-center space-y-2">
        <p class="text-xs font-semibold text-slate-300">💬 Need Help or Facing Issues?</p>
        <p class="text-[11px] text-slate-400">Contact admin directly on Telegram for fast withdrawal support.</p>
        <a href="https://t.me/PIYUSHYTUBER" target="_blank" class="inline-flex items-center justify-center gap-1.5 w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2 rounded-lg text-xs transition">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.03 9.56c-.15.68-.56.84-1.13.52l-3.1-2.28-1.5 1.44c-.17.17-.31.31-.63.31l.22-3.16 5.76-5.2c.25-.22-.05-.34-.39-.12l-7.12 4.48-3.07-.96c-.67-.21-.68-.67.14-.99l12.01-4.63c.56-.21 1.05.13.84.87z"/></svg>
          Contact @PIYUSHYTUBER
        </a>
      </div>

    </aside>

  </main>

  <!-- Application Script -->
  <script>
  const SMARTLINK_URL = 'https://omg10.com/4/11439413';
  let userId = localStorage.getItem('user_id') || ('user_' + Math.random().toString(36).substr(2, 9));
  localStorage.setItem('user_id', userId);

  let coins = parseFloat(localStorage.getItem('user_coins')) || 0.0;
  let timerInterval = null;
  let isTabActive = true;

  document.addEventListener('visibilitychange', () => { isTabActive = !document.hidden; });

  function updateBalanceUI() {
    document.getElementById('user-coins').innerText = coins.toFixed(1);
    localStorage.setItem('user_coins', coins.toString());
  }

  async function fetchLiveNews() {
    const container = document.getElementById('news-container');
    const category = document.getElementById('news-category').value;
    container.innerHTML = `<p class="text-slate-400 text-sm">Fetching real-time news...</p>`;

    const topic = category.toUpperCase();
    const rssUrl = `https://news.google.com/rss/headlines/section/topic/${topic}?hl=en-IN&gl=IN&ceid=IN:en`;
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

    try {
      const response = await fetch(apiUrl);
      const data = await response.json();

      container.innerHTML = '';
      data.items.slice(0, 10).forEach((art, index) => {
        const card = document.createElement('article');
        card.className = "bg-slate-800 border border-slate-700/60 p-4 rounded-xl shadow-md space-y-3";
        
        card.innerHTML = `
          <h3 class="text-md font-bold text-white line-clamp-2">${art.title}</h3>
          <div class="pt-2 border-t border-slate-700/50 flex justify-between items-center">
            <div id="timer-box-${index}" class="text-xs text-amber-400 hidden font-mono">
              ⏱️ Active reading: <span id="seconds-${index}">15</span>s left
            </div>
            <button id="read-btn-${index}" onclick="startReadingArticle(${index}, '${art.link}')" class="ml-auto bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs px-3.5 py-2 rounded-lg transition">
              Read & Earn (+0.2 Coins)
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    } catch (err) {
      container.innerHTML = `<p class="text-rose-400 text-sm">Failed to load news feeds.</p>`;
    }
  }

  function startReadingArticle(index, articleUrl) {
    window.open(articleUrl, '_blank');
    window.open(SMARTLINK_URL, '_blank');

    const btn = document.getElementById(`read-btn-${index}`);
    const timerBox = document.getElementById(`timer-box-${index}`);
    const timerText = document.getElementById(`seconds-${index}`);

    btn.disabled = true;
    btn.classList.add('opacity-50', 'cursor-not-allowed');
    timerBox.classList.remove('hidden');

    let timeSpent = 0;
    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      if (isTabActive) {
        timeSpent++;
        let remaining = 15 - timeSpent;
        timerText.innerText = remaining > 0 ? remaining : 0;

        if (timeSpent >= 15) {
          clearInterval(timerInterval);
          claimReward();
          timerBox.innerHTML = `<span class="text-emerald-400">✓ Reward Claimed!</span>`;
        }
      }
    }, 1000);
  }

  function claimReward() {
    coins += 0.2;
    updateBalanceUI();
    alert(`🎉 Earned 0.2 Coins!`);
  }

  // Handle Withdrawal Request to Supabase + Telegram
  async function handleWithdraw(e) {
    e.preventDefault();
    const btn = document.getElementById('withdraw-btn');
    const method = document.getElementById('pay-method').value;
    const details = document.getElementById('pay-details').value;
    const amount = parseFloat(document.getElementById('pay-amount').value);

    if (amount < 50) {
      alert("Minimum withdrawal requirement is 50 Coins!");
      return;
    }

    if (coins < amount) {
      alert("Insufficient coin balance!");
      return;
    }

    btn.disabled = true;
    btn.innerText = 'Processing...';

    try {
      const response = await fetch('/.netlify/functions/payout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, method, details, amount })
      });

      const data = await response.json();

      if (response.ok) {
        coins -= amount;
        updateBalanceUI();
        alert(`✅ Payout requested! Notification sent to admin via Telegram.`);
        document.getElementById('withdraw-form').reset();
      } else {
        alert(data.message || "Payout failed.");
      }
    } catch (err) {
      alert("Server error processing payout.");
    } finally {
      btn.disabled = false;
      btn.innerText = 'Request Payout';
    }
  }

  updateBalanceUI();
  fetchLiveNews();
  </script>

  <!-- Monetag Popunder Tag -->
  <script>(function(s){s.dataset.zone='11439402',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
