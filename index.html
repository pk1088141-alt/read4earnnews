<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsBuddy - Read & Earn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>⚡ NewsBuddy</h1>
        <div id="coin-balance">0.0 Coins</div>
    </header>

    <main>
        <!-- Sample Article Card -->
        <div class="card">
            <h3>Vivo launches T5e budget segment phone</h3>
            <p>Vivo launches T5e budget segment phone with Unisoc chip...</p>
            <button class="read-earn-btn" data-type="article_read">Read & Earn (+1.5 Coins)</button>
        </div>

        <!-- Sponsor Offer Card -->
        <div class="card sponsor-card">
            <h3>Want Bonus Coins? Check Sponsor Offers!</h3>
            <button class="read-earn-btn" data-type="sponsor_offer">View Sponsor Offer (+2 Coins)</button>
        </div>

        <!-- Redeem Earnings Form -->
        <div class="withdraw-box">
            <h3>🏴‍☠️ Redeem Earnings</h3>
            <label>Withdraw Method</label>
            <select id="withdraw-method">
                <option value="UPI">UPI</option>
            </select>

            <label>Account Details (UPI ID / Email)</label>
            <input type="text" id="account-details" placeholder="e.g. user@upi" required>

            <label>Amount (Min. 50 Coins)</label>
            <input type="number" id="withdraw-amount" value="50" min="50">

            <button id="payout-btn">Request Payout</button>
            <p><small>🔒 Anti-Fraud Protected. Min 50 Coins.</small></p>
        </div>
    </main>

    <!-- Monetag Tag -->
    <script>(function(s){s.dataset.zone='11439402',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    <script src="app.js"></script>
</body>
</html>
